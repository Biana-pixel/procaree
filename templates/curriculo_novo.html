<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Novo currículo | ProCareer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8fcfd,
                    #eef8fa
                );

            min-height: 100vh;

            color: #334155;

            padding: 35px 20px 50px;

        }


        /* =========================
           PÁGINA
        ========================= */

        .new-cv-page {

            width: 100%;

            max-width: 1000px;

            margin: 0 auto;

            animation: pageEnter .5s ease;

        }


        @keyframes pageEnter {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           TOPO
        ========================= */

        .page-topbar {

            display: flex;

            justify-content: center;

            align-items: center;

            margin-bottom: 30px;

            text-align: center;

        }


        .page-heading {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 9px;

        }


        .heading-icon {

            width: 52px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #dff6ff,
                    #dffaf7
                );

            color: #0ea5e9;

            font-size: 23px;

            box-shadow:
                0 8px 22px
                rgba(14, 165, 233, .12);

            transition: .25s ease;

        }


        .heading-icon:hover {

            transform:
                translateY(-3px)
                scale(1.05);

            box-shadow:
                0 12px 27px
                rgba(14, 165, 233, .20);

        }


        .page-heading h1 {

            font-size: 30px;

            color: #12383d;

            font-weight: 900;

            letter-spacing: -.6px;

            text-shadow:
                0 3px 5px
                rgba(14, 165, 233, .35),

                0 6px 12px
                rgba(14, 165, 233, .28);

        }


        /* =========================
           CARD
        ========================= */

        .form-container {

            position: relative;

            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            background: white;

            border: 1px solid #e1ecef;

            border-radius: 20px;

            padding: 34px;

            box-shadow:
                0 14px 38px
                rgba(15, 118, 110, .07);

            overflow: hidden;

        }


        /* LINHA AZUL */

        .form-container::before {

            content: "";

            position: absolute;

            top: 0;

            left: 0;

            right: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    #0ea5e9,
                    #38bdf8,
                    #0ea5e9
                );

        }


        /* CÍRCULO DECORATIVO */

        .form-container::after {

            content: "";

            position: absolute;

            width: 100px;

            height: 100px;

            right: -45px;

            top: -45px;

            border-radius: 50%;

            background:
                rgba(14, 165, 233, .07);

            pointer-events: none;

        }


        /* =========================
           CABEÇALHO
        ========================= */

        .form-header {

            position: relative;

            z-index: 1;

            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 28px;

            padding-bottom: 22px;

            border-bottom: 1px solid #edf2f3;

        }


        .form-header-icon {

            width: 45px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #e0f2fe,
                    #ecfeff
                );

            color: #0ea5e9;

            font-size: 19px;

        }


        .form-header h2 {

            margin: 0;

            font-size: 20px;

            color: #183f43;

            font-weight: 800;

        }


        /* =========================
           FORMULÁRIO
        ========================= */

        .form-grid {

            position: relative;

            z-index: 1;

            display: grid;

            grid-template-columns: 1fr;

            gap: 23px;

        }


        .form-group {

            display: flex;

            flex-direction: column;

        }


        .form-group label {

            display: flex;

            align-items: center;

            gap: 5px;

            margin-bottom: 9px;

            color: #334155;

            font-size: 16px;

            font-weight: 800;

        }


        .required {

            color: #0ea5e9;

            font-size: 17px;

        }


        .input-wrapper {

            position: relative;

        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 15px;

            pointer-events: none;

            transition: color .2s ease;

        }


        .input-wrapper:focus-within .input-icon {

            color: #0ea5e9;

        }


        .form-group input {

            width: 100%;

            height: 52px;

            padding:
                0 14px 0 41px;

            border: 1px solid #dce7ea;

            border-radius: 11px;

            outline: none;

            font-size: 16px;

            font-family: inherit;

            color: #334155;

            background: #fbfefe;

            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;

        }


        .form-group input:hover {

            border-color: #9bd5e8;

            background: white;

        }


        .form-group input:focus {

            border-color: #0ea5e9;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(14, 165, 233, .10);

        }


        .form-group input::placeholder {

            color: #94a3b8;

            font-size: 15px;

        }


        /* =========================
           BOTÕES
        ========================= */

        .form-actions {

            position: relative;

            z-index: 1;

            display: flex;

            justify-content: flex-end;

            align-items: center;

            gap: 11px;

            margin-top: 30px;

            padding-top: 23px;

            border-top: 1px solid #edf2f3;

        }


        .cancel-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: #475569;

            border: 1px solid #d8e2e5;

            background: white;

            padding: 0 18px;

            min-height: 48px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 800;

            transition: .2s ease;

        }


        .cancel-button:hover {

            background: #f8fafc;

            border-color: #cbd5e1;

            transform: translateY(-1px);

        }


        .save-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            background:
                linear-gradient(
                    135deg,
                    #0284c7,
                    #0ea5e9
                );

            color: white;

            border: none;

            padding: 0 20px;

            min-height: 48px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 18px
                rgba(14, 165, 233, .18);

            transition:
                transform .2s ease,
                box-shadow .2s ease;

        }


        .save-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 24px
                rgba(14, 165, 233, .28);

        }


        .save-button:active {

            transform: translateY(0);

        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 600px) {

            body {

                padding:
                    25px 14px 40px;

            }


            .page-topbar {

                margin-bottom: 25px;

            }


            .heading-icon {

                width: 46px;

                height: 46px;

                font-size: 20px;

            }


            .page-heading h1 {

                font-size: 26px;

            }


            .form-container {

                padding: 23px;

                border-radius: 17px;

            }


            .form-header {

                margin-bottom: 22px;

            }


            .form-header h2 {

                font-size: 18px;

            }


            .form-group label {

                font-size: 15px;

            }


            .form-group input {

                height: 52px;

                font-size: 16px;

            }


            .form-group input::placeholder {

                font-size: 14px;

            }


            .form-actions {

                flex-direction: column-reverse;

                align-items: stretch;

            }


            .cancel-button,
            .save-button {

                width: 100%;

                min-height: 48px;

                font-size: 15px;

            }

        }


        @media (max-width: 430px) {

            .form-container {

                padding: 19px;

            }


            .page-heading h1 {

                font-size: 24px;

            }


            .form-grid {

                gap: 18px;

            }


            .form-group label {

                font-size: 15px;

            }


            .required {

                font-size: 16px;

            }


            .form-group input {

                font-size: 16px;

            }


            .form-group input::placeholder {

                font-size: 14px;

            }

        }

    </style>

</head>


<body>


    <div class="new-cv-page">


        <!-- TOPO -->

        <div class="page-topbar">

            <div class="page-heading">

                <div class="heading-icon">
                    📄
                </div>

                <h1>
                    Novo currículo
                </h1>

            </div>

        </div>


        <!-- FORMULÁRIO -->

        <div class="form-container">


            <div class="form-header">

                <div class="form-header-icon">
                    ✏️
                </div>

                <div>

                    <h2>
                        Informações do currículo
                    </h2>

                </div>

            </div>


            <form
                method="POST"
                action="{{ url_for('curriculos.novo') }}"
                autocomplete="off"
            >


                <div class="form-grid">


                    <!-- NOME DO CURRÍCULO -->

                    <div class="form-group">

                        <label for="nome">

                            Nome do currículo

                            <span class="required">
                                *
                            </span>

                        </label>


                        <div class="input-wrapper">

                            <span class="input-icon">
                                📄
                            </span>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Ex.: Currículo Backend Python"
                                maxlength="150"
                                autocomplete="off"
                                required
                            >

                        </div>

                    </div>


                    <!-- LINK -->

                    <div class="form-group">

                        <label for="arquivo_url">
                            Link do currículo
                        </label>


                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔗
                            </span>

                            <input
                                type="url"
                                id="arquivo_url"
                                name="arquivo_url"
                                placeholder="https://..."
                                autocomplete="off"
                            >

                        </div>

                    </div>


                </div>


                <!-- BOTÕES -->

                <div class="form-actions">

                    <a
                        href="{{ url_for('curriculos.listar') }}"
                        class="cancel-button"
                    >
                        Cancelar
                    </a>


                    <button
                        type="submit"
                        class="save-button"
                    >
                        ✓
                        Salvar currículo
                    </button>

                </div>


            </form>


        </div>


    </div>


</body>

</html>
